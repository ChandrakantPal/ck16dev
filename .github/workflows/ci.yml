name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run check:contrast

      # No secrets are configured here on purpose: every signal provider is
      # optional, so a clean build without them proves the graceful degradation
      # the site depends on.
      - run: npm run build
